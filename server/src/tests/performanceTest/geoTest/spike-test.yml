config:
  target: 'http://localhost:5000'
  phases:
    - duration: 60
      arrivalRate: 1
      name: "Normal traffic"
    - duration: 30
      arrivalRate: 8
      name: "SPIKE - Emergency geo queries"
    - duration: 30
      arrivalRate: 12
      name: "PEAK SPIKE - Maximum emergency"
    - duration: 60
      arrivalRate: 3
      name: "Sustained high load"
    - duration: 60
      arrivalRate: 1
      name: "Recovery"
  defaults:
    headers:
      Content-Type: "application/json"
  timeout: 60
  payload:
    path: "geo-test-data.csv"
    fields:
      - "from_lng"
      - "from_lat"
      - "to_lng"
      - "to_lat"
      - "address_query"
      - "reverse_lat"
      - "reverse_lng"

scenarios:
  - name: "Spike - Emergency Routing"
    weight: 40
    flow:
      - get:
          url: "/api/geo/route?fromLng={{ from_lng }}&fromLat={{ from_lat }}&toLng={{ to_lng }}&toLat={{ to_lat }}&profile=driving&alternatives=true"
          expect:
            - statusCode: [200, 429, 500]

  - name: "Spike - Emergency Geocoding"
    weight: 30
    flow:
      - get:
          url: "/api/geo/geocode?q={{ address_query }}&limit=5"
          expect:
            - statusCode: [200, 429, 500]

  - name: "Spike - Emergency Reverse Geocoding"
    weight: 20
    flow:
      - get:
          url: "/api/geo/reverse?lat={{ reverse_lat }}&lng={{ reverse_lng }}"
          expect:
            - statusCode: [200, 429, 500]

  - name: "Spike - Multiple Routing Profiles"
    weight: 10
    flow:
      - get:
          url: "/api/geo/route?fromLng={{ from_lng }}&fromLat={{ from_lat }}&toLng={{ to_lng }}&toLat={{ to_lat }}&profile=cycling&alternatives=false"
          expect:
            - statusCode: [200, 429, 500]
